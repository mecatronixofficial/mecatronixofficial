<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Meca AI pixel mascot" shape-rendering="crispEdges">
  <title>Meca AI</title>
  <style>
    .bot   { animation: bob .8s steps(1) infinite; }
    .legA  { animation: flick .8s steps(1) infinite; }
    .legB  { animation: flick .8s steps(1) infinite reverse; }
    .hl    { animation: hand .8s steps(1) infinite; }
    .hr    { animation: hand .8s steps(1) infinite reverse; }
    .chest { animation: flick 1.4s steps(1) infinite; }
    .eO { animation: eO 6s steps(1) infinite; }
    .eB { animation: eB 6s steps(1) infinite; }
    .eH { animation: eH 6s steps(1) infinite; }
    .word  { font: 800 34px 'Courier New',Consolas,monospace; letter-spacing: 5px; }
    .cur   { animation: flick 1s steps(1) infinite; }
    @keyframes bob   { 0% { transform: translateY(0); } 25% { transform: translateY(-7px); } 50% { transform: translateY(0); } 75% { transform: translateY(-7px); } }
    @keyframes hand  { 0% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes flick { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes eO { 0%,64% { opacity: 1; } 60%,80% { opacity: 0; } }
    @keyframes eB { 0%,64% { opacity: 0; } 60% { opacity: 1; } }
    @keyframes eH { 0% { opacity: 0; } 80% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .eB,.eH,.legB { opacity: 0; } }
  </style>

