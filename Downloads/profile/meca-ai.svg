<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" role="img" aria-label="Meca AI, the Mecatronix assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Meca AI</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#E11D2E" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#6E0010" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="visorClip"><rect x="140" y="135" width="140" height="60" rx="30"/></clipPath>
  </defs>

  <style>
    .pulse  { animation: pulse 3s ease-in-out infinite; transform-origin: 210px 220px; }
    .ring1  { animation: spin 18s linear infinite; transform-origin: 210px 220px; }
    .ring2  { animation: spin 12s linear infinite reverse; transform-origin: 210px 220px; }
    .bot    { animation: float 4s ease-in-out infinite; }
    .eye    { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    .bulb   { animation: beacon 1.4s ease-in-out infinite; }
    .core   { animation: core 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bar    { animation: talk 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s } .b5 { animation-delay: .6s }
    .name   { font: 800 36px 'JetBrains Mono','Fira Code',Consolas,monospace; letter-spacing: 4px; }
    .tag    { font: 500 13px 'JetBrains Mono','Fira Code',Consolas,monospace; letter-spacing: 3px; }
    .cursor { animation: beacon 1s steps(1) infinite; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes pulse  { 0%,100% { opacity: .65; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes blink  { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
    @keyframes beacon { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
    @keyframes core   { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.25); opacity: 1; } }
    @keyframes talk   { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- aura -->
  <circle class="pulse" cx="210" cy="220" r="190" fill="url(#glow)"/>

  <!-- orbit rings -->
  <g class="ring1">
    <circle cx="210" cy="220" r="172" fill="none" stroke="#E11D2E" stroke-width="2" stroke-dasharray="4 14" opacity=".8"/>
    <circle cx="210" cy="48" r="6" fill="#E11D2E"/>
  </g>
  <g class="ring2">
    <circle cx="210" cy="220" r="152" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="60 30 4 30" opacity=".35"/>
    <circle cx="362" cy="220" r="4" fill="#FFFFFF"/>
    <circle cx="58" cy="220" r="4" fill="#FFFFFF"/>
  </g>

  <!-- robot -->
  <g class="bot">
    <!-- antenna -->
    <line x1="210" y1="100" x2="210" y2="74" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle class="bulb" cx="210" cy="66" r="9" fill="#E11D2E"/>
    <circle cx="210" cy="66" r="15" fill="none" stroke="#E11D2E" stroke-width="2" opacity=".4"/>

    <!-- ear modules -->
    <rect x="102" y="148" width="20" height="54" rx="7" fill="#E11D2E"/>
    <rect x="298" y="148" width="20" height="54" rx="7" fill="#E11D2E"/>
    <line x1="112" y1="160" x2="112" y2="190" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
    <line x1="308" y1="160" x2="308" y2="190" stroke="#050505" stroke-width="3" stroke-linecap="round"/>

    <!-- head -->
    <rect x="120" y="100" width="180" height="150" rx="42" fill="url(#shell)" stroke="#E11D2E" stroke-width="4"/>
    <path d="M150 112 Q210 102 270 112" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".25" stroke-linecap="round"/>

    <!-- visor -->
    <rect x="140" y="135" width="140" height="60" rx="30" fill="#020202" stroke="#2A2A2A" stroke-width="2"/>
    <g clip-path="url(#visorClip)">
      <rect class="eye" x="166" y="150" width="30" height="30" rx="15" fill="#E11D2E"/>
      <rect class="eye" x="224" y="150" width="30" height="30" rx="15" fill="#E11D2E"/>
      <circle cx="176" cy="160" r="5" fill="#FFFFFF" opacity=".9"/>
      <circle cx="234" cy="160" r="5" fill="#FFFFFF" opacity=".9"/>
      <rect x="120" y="135" width="26" height="60" fill="url(#scan)">
        <animate attributeName="x" values="120;276;120" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- voice equalizer mouth -->
    <g fill="#FFFFFF">
      <rect class="bar"    x="183" y="210" width="6" height="22" rx="3"/>
      <rect class="bar b2" x="194" y="210" width="6" height="22" rx="3"/>
      <rect class="bar b3" x="205" y="210" width="6" height="22" rx="3" fill="#E11D2E"/>
      <rect class="bar b4" x="216" y="210" width="6" height="22" rx="3"/>
      <rect class="bar b5" x="227" y="210" width="6" height="22" rx="3"/>
    </g>

    <!-- neck + torso -->
    <rect x="192" y="250" width="36" height="16" rx="4" fill="#2A2A2A"/>
    <rect x="148" y="264" width="124" height="82" rx="26" fill="url(#shell)" stroke="#E11D2E" stroke-width="4"/>
    <circle cx="210" cy="304" r="22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".5"/>
    <circle class="core" cx="210" cy="304" r="13" fill="#E11D2E"/>
    <path d="M203 309 L203 299 L210 306 L217 299 L217 309" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="164" y1="288" x2="180" y2="288" stroke="#E11D2E" stroke-width="3" stroke-linecap="round"/>
    <line x1="164" y1="320" x2="176" y2="320" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".4"/>
    <line x1="240" y1="288" x2="256" y2="288" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".4"/>
    <line x1="244" y1="320" x2="256" y2="320" stroke="#E11D2E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- name plate -->
  <text class="name" x="246" y="412" text-anchor="end" fill="#FFFFFF" style="letter-spacing:4px">MECA</text>
  <text class="name" x="258" y="412" text-anchor="start" fill="#E11D2E">AI</text>
  <text class="tag" x="204" y="440" text-anchor="middle" fill="#BDBDBD">ENGINEERING COPILOT</text>
  <rect class="cursor" x="320" y="430" width="9" height="12" fill="#E11D2E"/>
</svg>
